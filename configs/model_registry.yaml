models:
  vistral:
    name: Vistral
    hf_id: Viet-Mistral/Vistral-7B-Chat
    url: https://huggingface.co/Viet-Mistral/Vistral-7B-Chat
    local_dir: models/Vistral-7B-Chat
    loader: AutoModelForCausalLM
    tokenizer: AutoTokenizer
    mode: main_jamp_backbone_qlora_or_adapter_inference
    quantization: nf4_4bit
  qwen3_4b:
    name: Qwen3-4B-Instruct-2507
    hf_id: Qwen/Qwen3-4B-Instruct-2507
    url: https://huggingface.co/Qwen/Qwen3-4B-Instruct-2507
    local_dir: models/Qwen3-4B-Instruct-2507
    loader: AutoModelForCausalLM
    tokenizer: AutoTokenizer
    mode: optional_prompt_only_baseline
    quantization: nf4_4bit
  qwen35_4b:
    name: Qwen3.5-4B
    hf_id: Qwen/Qwen3.5-4B
    url: https://huggingface.co/Qwen/Qwen3.5-4B
    local_dir: models/Qwen3.5-4B
    loader: AutoModelForImageTextToText
    processor: AutoProcessor
    mode: future_text_only_multimodal_baseline
  gemma4_e2b:
    name: Gemma-4-E2B-it
    hf_id: google/gemma-4-E2B-it
    url: https://huggingface.co/google/gemma-4-E2B-it
    local_dir: models/gemma-4-E2B-it
    loader: AutoModelForImageTextToText
    processor: AutoProcessor
    mode: future_text_only_multimodal_baseline
  phobert:
    name: PhoBERT-base-v2
    hf_id: vinai/phobert-base-v2
    url: https://huggingface.co/vinai/phobert-base-v2
    local_dir: models/phobert-base-v2
    loader: AutoModelForSequenceClassification
    tokenizer: AutoTokenizer
    mode: encoder_baseline
  xlmr:
    name: XLM-RoBERTa-base
    hf_id: FacebookAI/xlm-roberta-base
    url: https://huggingface.co/FacebookAI/xlm-roberta-base
    local_dir: models/xlm-roberta-base
    loader: AutoModelForSequenceClassification
    tokenizer: AutoTokenizer
    mode: encoder_baseline
