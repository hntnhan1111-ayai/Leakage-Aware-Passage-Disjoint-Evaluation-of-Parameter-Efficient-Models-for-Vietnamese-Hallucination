[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vihallu-fisat2026-repro"
version = "0.1.0"
description = "Leakage-audited, passage-disjoint Vietnamese hallucination detection experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "tabulate>=0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
